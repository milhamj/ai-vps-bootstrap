name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning bootstrap.sh scripts/*.sh
      - name: Python compiles
        run: python3 -m py_compile scripts/*.py
      - name: Install Ansible tooling
        run: |
          pipx install ansible-core && pipx install ansible-lint
          ansible-galaxy collection install -r requirements.yml
      - name: Playbook syntax
        run: ansible-playbook --syntax-check -i ansible/inventory/localhost.yml ansible/playbook.yml
      - name: Hermes templates render through Ansible
        run: ansible-playbook tests/render-hermes-templates.yml
      - name: ansible-lint
        run: ansible-lint --profile min ansible/playbook.yml

  # Builds the terminal image with android_sdk enabled and checks the toolchain inside it.
  android-image:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable the Android toolchain
        run: |
          sudo apt-get install -y python3-yaml
          printf '%s\n' 'android_sdk: true' > ansible/local-vars.yml
      - name: Build the image (downloads are checked against pinned SHA-256 sums)
        run: ./scripts/build-image.sh
      - name: JDK 17 and the configured SDK packages are installed
        run: |
          image=$(python3 scripts/effective_vars.py hermes_docker_image)
          out=$(docker run --rm "$image" sh -c 'java -version 2>&1 && sdkmanager --list_installed 2>&1')
          echo "$out"
          grep -q 'version "17' <<<"$out"
          for package in $(python3 scripts/effective_vars.py android_sdk_packages); do
            grep -qF "$package " <<<"$out"
          done
      - name: The container user can add SDK components (owned by HERMES_UID)
        run: |
          image=$(python3 scripts/effective_vars.py hermes_docker_image)
          docker run --rm "$image" sh -c 'test -w "$ANDROID_HOME" && echo writable'

  # Runs the real setup on a GitHub Ubuntu 24.04 runner as a stand-in for a fresh VPS.
  # Hermes itself is not installed: it needs interactive sign-in, so verify reports it as pending.
  e2e:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Remove the runner's preinstalled Docker so the playbook installs Ubuntu's packages
        run: |
          pkgs=$(dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' 'docker*' 'containerd*' 'moby*' 2>/dev/null \
            | awk '$1 == "ii" { print $2 }')
          if [[ -n $pkgs ]]; then sudo apt-get purge -y $pkgs; fi
      - name: Give the runner user an SSH key, as on a real VPS
        run: |
          install -d -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/ci_key
          cat ~/.ssh/ci_key.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
      - name: make install
        run: make install
      - name: Key login still works and password login is refused after hardening
        run: |
          sudo systemctl start ssh
          ssh -i ~/.ssh/ci_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$USER@localhost" true
          if ssh -o BatchMode=yes -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new \
              "$USER@localhost" true 2> password.log; then
            echo 'Password-only login unexpectedly succeeded' >&2; exit 1
          fi
          grep -q 'Permission denied (publickey)' password.log
          sudo ufw status verbose
      - name: make configure is idempotent
        run: |
          ./scripts/configure.sh | tee configure.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' configure.log
      - name: Set an agent git identity so the image build and verify exercise it
        run: |
          printf '%s\n' "agent_git_name: ci-agent" "agent_git_email: 'ci-agent@users.noreply.github.com'" \
            > ansible/local-vars.yml
      - name: make image-qa
        run: sg docker -c 'make image-qa'
      - name: make verify (before Hermes)
        run: sg docker -c 'make verify'

      # Hermes layer: everything that needs no interactive sign-in. Model sign-in, Telegram
      # gateways, and real model calls stay manual (see docs/next-steps.md).
      - name: make hermes-install
        run: make hermes-install
      - name: make configure creates and configures the Hermes profiles
        run: sg docker -c 'make configure'
      - name: make configure is idempotent with Hermes installed
        run: |
          sg docker -c './scripts/configure.sh' | tee configure-hermes.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' configure-hermes.log
      - name: make verify fails while OpenRouter profiles have no key
        run: |
          if sg docker -c 'make verify' 2> verify-missing.log; then
            echo 'make verify passed without provider keys' >&2; exit 1
          fi
          grep -q 'make provider-keys' verify-missing.log
      - name: make provider-keys sets a key on every OpenRouter profile
        run: |
          printf 'sk-or-v1-ci-placeholder\n' | make provider-keys
          ./scripts/set-provider-keys.sh --check
      - name: make verify (with Hermes)
        run: sg docker -c 'make verify'
