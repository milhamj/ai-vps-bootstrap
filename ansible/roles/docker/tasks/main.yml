---
# Starter uses Ubuntu's maintained packages; pin tested versions before strict reproducibility is required.
- name: Install Docker Engine from Ubuntu repository
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
- name: Start Docker daemon
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
- name: Allow selected user to use Docker socket when opted in
  ansible.builtin.user:
    name: '{{ factory_user }}'
    groups: docker
    append: true
  when: docker_group_access | bool
