# Review these choices before running on a fresh server.
factory_relative_path: software-factory
legacy_factory_relative_path: projects/software-factory
docker_group_access: true
# Disable SSH root login (always, with keys or passwords) and, unless ssh_password_login is true,
# password login for everyone. Key-only mode refuses to apply unless the target user (and the user
# running the playbook) already has a public key in ~/.ssh/authorized_keys.
ssh_hardening: true
# Keep password login for non-root users. Root stays blocked either way; Fail2ban limits guessing.
ssh_password_login: false
# SSH port allowed through the firewall. This does not change the port sshd listens on.
ssh_port: 22
# UFW: deny incoming except SSH, allow outgoing.
firewall_enabled: true
# Fail2ban sshd jail.
fail2ban_enabled: true
# Require GPG-signed commits for the target user (git commit.gpgsign). Needs a GPG key on the host.
git_commit_signing: false
hermes_version: '0.21.2'
hermes_commit: '5eb99eb2844b22ebb723711b8e6a0bbb80bb5f04'
hermes_branch: main
# Model presets. Each profile picks one with model: in hermes_profiles; the main profile uses
# hermes_main_model. codex signs in with a ChatGPT subscription (hermes setup); openrouter needs an
# API key added once with: hermes auth add openrouter (named profiles fall back to it).
hermes_models:
  codex: { default: 'gpt-5.6-sol', provider: openai-codex, base_url: 'https://chatgpt.com/backend-api/codex' }
  glm-flash: { default: 'z-ai/glm-5.3-flash', provider: openrouter, base_url: 'https://openrouter.ai/api/v1' }
hermes_main_model: codex
hermes_docker_image: 'hermes-qa-playwright:1.63.0'
# Git identity for commits made in the specialist Docker terminals (hoe, techlead, engineer, qa).
# Baked into the terminal image as its system git config; run make image-qa after changing it.
# Empty leaves the image without an identity, so agent commits fail until one is set.
# Example: agent_git_name: my-agent-bot, agent_git_email: 'id+my-agent-bot@users.noreply.github.com'
agent_git_name: ''
agent_git_email: ''
# Environment variables passed from each specialist profile's .env into its Docker terminal, by
# name. Set to [GH_TOKEN] and put GH_TOKEN=<token> in ~/.hermes/profiles/<profile>/.env (mode 600)
# for the profiles that push or open pull requests. Values never go in this repository.
agent_forward_env: []
# Trailer lines every agent commit message must end with, added as a rule in the factory AGENTS.md.
# Example: ['Co-Authored-By: Your Name <id+username@users.noreply.github.com>']
agent_commit_trailers: []
# Hermes tool sets, applied to each profile's cli and telegram platforms.
# main: the profiles you talk to. specialist: Kanban workers, without delegation or connections.
hermes_toolsets:
  main: [web, browser, terminal, file, code_execution, skills, todo, kanban, memory, session_search, clarify, delegation, vision, connections, cronjob, image_gen]
  specialist: [terminal, file, code_execution, web, browser, skills, todo, kanban, memory, session_search, clarify]
# The Hermes default profile always uses config/software-factory/agents/main/SOUL.md and the main tool set.
# Each specialist profile below gets a Docker terminal and the SOUL.md from
# config/software-factory/agents/<role>/. Set gateway: true for profiles you message directly;
# their hermes-gateway-<name>.service is restarted after config changes if it is running.
# toolsets picks a key from hermes_toolsets (default: specialist); model picks a key from
# hermes_models (default: hermes_main_model).
# The default profile always has a gateway (hermes-gateway.service).
hermes_profiles:
  - { name: hoe, role: head-of-engineering, gateway: true, toolsets: main, model: codex }
  - { name: techlead, role: tech-lead, model: codex }
  - { name: engineer, role: engineer, model: glm-flash }
  - { name: qa, role: qa, model: glm-flash }
base_packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - python3
  - python3-apt
  - python3-yaml
  - ripgrep
  - tmux
  - unzip
  - zip
