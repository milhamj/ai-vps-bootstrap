---
# Renders the Hermes profile templates through Ansible's own template lookup (the same path
# hermes_config uses) and checks the result parses as YAML with the expected settings.
# Run: ansible-playbook tests/render-hermes-templates.yml
- name: Render Hermes profile templates
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../ansible/vars.yml
  vars:
    factory_home: /home/ci-user
  tasks:
    - name: Check each rendered template
      vars:
        rendered: "{{ lookup('ansible.builtin.template', playbook_dir + '/../config/hermes/' + item.template) | from_yaml }}"
      ansible.builtin.assert:
        that:
          - rendered.model == item.model
          - rendered.proxy.enabled == false
          - rendered.compression.threshold == 0.5
          - rendered.browser.cloud_provider == 'local'
          - rendered.platform_toolsets.cli == item.toolsets
          - rendered.platform_toolsets.telegram == item.toolsets
          - rendered.terminal.backend == item.backend
          - item.backend != 'docker' or rendered.terminal.docker_forward_env == agent_forward_env
        fail_msg: '{{ item.template }} did not render to the expected Hermes settings'
      loop:
        - template: default.yml.j2
          backend: local
          toolsets: '{{ hermes_toolsets.main }}'
          model: '{{ hermes_models[hermes_main_model] }}'
        - template: specialist.yml.j2
          backend: docker
          toolsets: '{{ hermes_toolsets.specialist }}'
          model: '{{ hermes_models["glm-flash"] }}'

    - name: Check the commit conventions in AGENTS.md follow the identity and trailer settings
      vars:
        agent_git_name: '{{ case.name }}'
        agent_git_email: '{{ case.email }}'
        agent_commit_trailers: '{{ case.trailers }}'
        agents_md: "{{ lookup('ansible.builtin.template', playbook_dir + '/../config/software-factory/AGENTS.md') }}"
        identity: 'ci-agent <1+ci-agent@users.noreply.github.com>'
        trailer: 'Co-Authored-By: Example <2+example@users.noreply.github.com>'
      ansible.builtin.assert:
        that:
          - ('Commit conventions' in agents_md) == (case.name != '' or case.trailers | length > 0)
          - (identity in agents_md) == (case.name != '')
          - (trailer in agents_md) == (case.trailers | length > 0)
          - "'endif' not in agents_md and 'endfor' not in agents_md"
      loop:
        - { name: '', email: '', trailers: [] }
        - { name: ci-agent, email: '1+ci-agent@users.noreply.github.com', trailers: [] }
        - { name: '', email: '', trailers: ['Co-Authored-By: Example <2+example@users.noreply.github.com>'] }
        - { name: ci-agent, email: '1+ci-agent@users.noreply.github.com', trailers: ['Co-Authored-By: Example <2+example@users.noreply.github.com>'] }
      loop_control:
        loop_var: case
